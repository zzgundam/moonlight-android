name: Android Auto Built Snapshot Apk CI

on: 
  push:
    paths-ignore:
      - '**.md'
      - '**.json'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Init nested submodules
      run: git submodule update --init --recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Set NDK
      uses: nttld/setup-ndk@v1
      with:
       ndk-version: r27
       link-to-sdk: true

    - name: Set Cache
      uses: actions/cache@v4
      with:
        path: |
          build
          app/build
        key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: List APK outputs
      run: find app/build/outputs/apk -name "*.apk" || true

    - name: Upload NonRoot Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "auto_built_snapshot_nonRoot_${{ github.sha }}.apk"
        path: app/build/outputs/apk/**/app-nonRoot*.apk
        retention-days: 10

    - name: Upload Root Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "auto_built_snapshot_root_${{ github.sha }}.apk"
        path: app/build/outputs/apk/**/app-root*.apk
        retention-days: 10
